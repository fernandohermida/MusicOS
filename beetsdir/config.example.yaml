# MusicOS beets config template.
#
# Copy this file to config.yaml (in the same beetsdir/ folder) and fill in
# the values marked CHANGE-ME below. See docs/SETUP.md for the full
# walkthrough and docs/LIBRARY-LAYOUT.md for why the paths: section below
# looks the way it does — it's plain beets config, no plugin involved.

# --------------- Where things live ---------------

# CHANGE-ME: the external folder where music files actually live.
# Never point this inside MusicOS/ — see CLAUDE.md's invariants.
directory: CHANGE-ME/path/to/your/music/library

# Relative paths resolve inside BEETSDIR (this file's own directory).
library: library.db

# --------------- Plugins ---------------
# Zero-extra-dependency set for v1 — see docs/BEETS-CHEATSHEET.md.
# fetchart/lastgenre (used by music-curate) are NOT listed here: they need
# extra pip packages that aren't installed by default. Add them only after
# reinstalling beets with those extras (see docs/SETUP.md) — enabling a
# plugin here without its dependency installed stops beets from starting.
plugins: export types missing duplicates unimported limit musicbrainz mbsync smartplaylist inline

# --------------- On-disk layout ---------------
# Keys other than 'default' are beets queries, tried in the order they
# appear here — first match wins, 'default' is always the final fallback
# regardless of where it's written. See docs/LIBRARY-LAYOUT.md.

# Computed fields (via the inline plugin, listed above) used in paths below.
item_fields:
  # Alphabetical bucket: "A".."Z" or "#" for anything that doesn't start
  # with a letter (numbers, symbols, "3T", "2Pac", etc). Ignores a leading
  # English ("The"/"A"/"An") or Spanish definite ("El"/"La"/"Los"/"Las")
  # article for sorting purposes only — $albumartist itself (and the
  # folder name derived from it) is left untouched.
  initial: |
    name = albumartist or ''
    for article in ('the ', 'a ', 'an ', 'el ', 'la ', 'los ', 'las '):
        if name.lower().startswith(article):
            name = name[len(article):]
            break
    return name[0].upper() if name and name[0].isalpha() else '#'
  # 1 when an album has more than one disc, else 0. Prefixes the disc
  # number in paths below so disc 1 track 1 and disc 2 track 1 don't both
  # land on "01" in the same album folder.
  multidisc: 1 if (disctotal or 0) > 1 else 0

paths:
  # Checked in order, first match wins — must come before 'comp' so a
  # Various-Artists film soundtrack lands in Soundtracks/ rather than
  # Various Artists/.
  albumtype:soundtrack: Soundtracks/$album%aunique{}/%if{$multidisc,$disc-}$track $artist - $title
  default: $initial/$albumartist/$album%aunique{}/%if{$multidisc,$disc-}$track $title
  singleton: $initial/Non-Album/$artist/$title
  comp: Various Artists/$album%aunique{}/%if{$multidisc,$disc-}$track $artist - $title

# --------------- Machine-readable output ---------------
# Pins export formatting so music-query/music-organize/music-lint parse
# consistently — see docs/BEETS-CHEATSHEET.md's export-formatting gotchas.

time_format: '%Y-%m-%d %H:%M:%S'
format_raw_length: yes

# --------------- Playlists (music-playlist) ---------------
# auto: no is deliberate — MusicOS regenerates playlists explicitly via the
# music-playlist skill, not silently on every database change.

smartplaylist:
  auto: no
  playlist_dir: CHANGE-ME/path/to/where/your/player/reads/playlists
  relative_to: CHANGE-ME/path/to/your/music/library   # should match directory: above
  playlists: []
    # - name: 'Jazz.m3u'
    #   query: 'genre:jazz'

# --------------- Import behavior ---------------
# Defaults are sane; music-ingest overrides per-invocation as needed
# (--pretend, --set, -q --quiet-fallback skip). Nothing to change here
# unless you have a strong preference.
#
# `copy: yes` and no `incremental:` setting (beets' own default is off) are
# right for a fresh v1 setup with big initial batches still being sorted
# out. Once your library settles down (0 placement drift, initial
# consolidation done), it's worth revisiting both: `incremental: yes` skips
# reprocessing already-imported source paths, and switching to
# `move: yes` / `copy: no` relocates new music straight into the library
# instead of leaving originals to clean up by hand — see the real config.yaml
# in this repo for that pattern and the cross-filesystem/archive-deletion
# caveats that come with enabling move.

import:
  copy: yes
  write: yes
